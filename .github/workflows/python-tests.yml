name: Offline Python checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline regression checks
        run: |
          fail=0
          for f in tests/test_*.py; do
            echo "--- $f"
            python "$f" || fail=1
          done
          python experiments/validate_synth.py || fail=1
          exit $fail
